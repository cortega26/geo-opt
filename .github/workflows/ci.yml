name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ".agents/skills/geo-optimization/scripts/requirements.txt"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r .agents/skills/geo-optimization/scripts/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: JS tests and badge verification
        # One full suite run per leg: count + branch-coverage badges are
        # verified from the same c8 run (Plan 087).
        run: npm run test:verify

      - name: Plan archive gate
        run: node scripts/check-plan-archive.js

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (schema)
        run: npm run typecheck:schema

      - name: Python compatibility tests
        run: python3 .agents/skills/geo-optimization/scripts/test_optimizer.py

      - name: Changelog policy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changelog.js

      - name: Validate package
        run: npm run validate:package

      - name: Dogfood — audit own documentation
        # v2 profile-aware scoring: our technical docs score lower on quotation/
        # statistics dimensions where v2 correctly marks them N/A. Threshold 30
        # catches genuinely problematic content while allowing for the natural
        # scoring profile of reference documentation. docs/audits/ is excluded:
        # those files are archival audit evidence (Historical record class in
        # documentation-governance.md), not discoverable content.
        run: node bin/cli.js audit docs/ --recursive --ignore "docs/audits/" --threshold 30

      - name: Security audit
        # Blocks on high/critical advisories, minus a justified allowlist of
        # advisories that are unfixable upstream. See scripts/check-audit.js.
        run: npm run audit:check
