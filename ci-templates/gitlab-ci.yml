# geo-opt GitLab CI template
#
# Include this template in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/cortega26/geo-opt/main/ci-templates/gitlab-ci.yml'
#
# Then customize via CI/CD variables in your project settings:
#
#   GEO_OPT_PATH       — file or directory to audit (default: ".")
#   GEO_OPT_THRESHOLD  — fail if score is below this value (e.g. "70")
#   GEO_OPT_RECURSIVE  — set to "true" to scan directories recursively
#   GEO_OPT_MODEL      — scoring model: "v2" (default) or "v1" (legacy)
#   GEO_OPT_LABEL      — badge label text (default: "GEO Score")
#   TOOLTICIAN_LICENSE_KEY — Pro license key (Pro-gated features: report, --no-branding)

.geo-opt-audit:
  image: node:22-alpine
  variables:
    GEO_OPT_PATH: "."
    GEO_OPT_THRESHOLD: ""
    GEO_OPT_RECURSIVE: "false"
    GEO_OPT_MODEL: "v2"
    GEO_OPT_LABEL: "GEO Score"
    TOOLTICIAN_LICENSE_KEY: ""
  before_script:
    - npm install -g geo-opt
  script:
    - |
      ARGS="audit \"$GEO_OPT_PATH\" --model $GEO_OPT_MODEL"

      if [ "$GEO_OPT_RECURSIVE" = "true" ]; then
        ARGS="$ARGS --recursive"
      fi

      if [ -n "$GEO_OPT_THRESHOLD" ]; then
        ARGS="$ARGS --threshold $GEO_OPT_THRESHOLD"
      fi

      eval "geo-opt $ARGS"
  artifacts:
    when: always
    paths:
      - geo-opt-audit.json
    expire_in: 30 days

geo-opt-audit:
  extends: .geo-opt-audit
  stage: test
  script:
    - |
      ARGS="audit \"$GEO_OPT_PATH\" --summary --format json --model $GEO_OPT_MODEL"

      if [ "$GEO_OPT_RECURSIVE" = "true" ]; then
        ARGS="$ARGS --recursive"
      fi

      if [ -n "$GEO_OPT_THRESHOLD" ]; then
        ARGS="$ARGS --threshold $GEO_OPT_THRESHOLD"
      fi

      # Run the audit, capture its exit status, then replay stdout: a bare
      # `| tee` pipeline would end with tee's exit (0) and mask a failed
      # audit (threshold breach, per-file error). Redirect + capture keeps
      # both the artifact and the job log (Plan 072).
      eval "geo-opt $ARGS" > geo-opt-audit.json
      GEO_OPT_EXIT=$?
      cat geo-opt-audit.json

      # Extract the aggregate score from summary JSON (--summary above emits
      # one object with averageScore covering the whole audited set, not file
      # zero). Missing or non-numeric scores fail the job explicitly instead
      # of fabricating a zero, and the || exit 1 guard makes that independent
      # of shell errexit settings (Plan 072).
      SCORE=$(node -e "
        const fs = require('fs');
        let d;
        try {
          d = JSON.parse(fs.readFileSync('geo-opt-audit.json','utf8'));
        } catch (err) {
          console.error('geo-opt GitLab template: audit output is not valid JSON: ' + err.message);
          process.exit(2);
        }
        // typeof guard first: Number() would coerce null (JSON.stringify of
        // NaN) to 0 and strings to numbers, silently fabricating a score.
        // Single quotes survive the enclosing double-quoted node -e string.
        const s = d?.averageScore;
        if (typeof s !== 'number' || !Number.isFinite(s)) {
          console.error('geo-opt GitLab template: audit summary has no numeric averageScore; cannot render a truthful badge');
          process.exit(2);
        }
        process.stdout.write(String(Math.round(s)));
      ") || exit 1

      COLOR=red
      [ "$SCORE" -ge 41 ] && COLOR=orange
      [ "$SCORE" -ge 61 ] && COLOR=yellow
      [ "$SCORE" -ge 76 ] && COLOR=green
      [ "$SCORE" -ge 90 ] && COLOR=brightgreen

      LABEL_ENC=$(echo "$GEO_OPT_LABEL" | sed 's/ /_/g')
      BADGE_URL="https://img.shields.io/badge/${LABEL_ENC}-${SCORE}%2F100-${COLOR}"

      echo "GEO_SCORE=$SCORE" >> geo-opt-env.env
      echo "GEO_BADGE_URL=$BADGE_URL" >> geo-opt-env.env

      echo "GEO score: ${SCORE}/100"
      echo "Badge URL: ${BADGE_URL}"

      # End with the audit's exit status so the job's pass/fail matches the
      # CLI gate (POSIX-portable; PIPESTATUS is bash-only). If the score
      # parse failed above, the || exit 1 guard already failed the job.
      exit $GEO_OPT_EXIT
  artifacts:
    when: always
    reports:
      # Este job es el que crea geo-opt-env.env — el dotenv se declara aquí,
      # no en el job hidden (F-13): un artifact dotenv ausente falla el job.
      dotenv: geo-opt-env.env
